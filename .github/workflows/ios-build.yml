name: TrapAndPlay iOS Build

on:
  workflow_dispatch:

jobs:
  build-ios:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Check build environment
        run: |
          sw_vers
          xcodebuild -version
          python3 --version

      - name: Install pygame-ios
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install pygame-ios

      - name: Prepare game source
        run: |
          mkdir -p ios-source
          cp Trap_and_Play_v2_preview.py ios-source/main.py

      - name: Generate iOS project
        run: |
          pygame_ios ios-source main.py 2.5.6

      - name: Find Xcode project
        run: |
          find . -name "*.xcodeproj"

      - name: Upload iOS project
        uses: actions/upload-artifact@v4
        with:
          name: TrapAndPlay-iOS-Project
          path: |
            pygame-ios-template/
          if-no-files-found: error
